[pytest]
asyncio_mode = auto
# asyncpg engine connections are loop-affine; the module-level engines are
# created once, so async tests AND async fixtures share one session loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
